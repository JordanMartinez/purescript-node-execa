    - functions: ">=6.0.0 <7.0.0"
    - integers: ">=6.0.0 <7.0.0"
    - js-timers: ">=6.1.0 <7.0.0"
    - maybe: ">=6.0.0 <7.0.0"
    - node-buffer: ">=9.0.0 <10.0.0"
