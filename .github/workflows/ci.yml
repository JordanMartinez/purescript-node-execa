name: CI

# Run CI when a PR is opened against the branch `master`
# and when one pushes a commit to `master`.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Run CI on all 3 latest OSes
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node toolchain
        uses: actions/setup-node@v3
        with:
          node-version: "lts/*"

      - name: Cache NPM dependencies
        uses: actions/cache@v3
        env:
          cache-name: cache-node-modules
        with:
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Setup PureScript tooling
        run:
          npm i -g purescript@latest purs-tidy@latest purescript-psa@latest spago@1.0.5

      - name: Cache PureScript dependencies
        uses: actions/cache@v3
        with:
          key: ${{ runner.os }}-spago-${{ hashFiles('**/spago.yaml') }}
          path: |
            .spago
            output

      - name: Install Spago dependencies
        run: npx spago fetch

      - name: Build the project
        run: |
          npx spago build

      - name: Run tests
        run: |
          npx spago test

      - name: Check Formatting
        if: runner.os == 'Linux'
        run: |
          npx purs-tidy check src test
